services:
  postgres:
    # Matches Neon's Postgres 18, so a pg_dump/pg_restore of a Neon database
    # is always version-compatible with this local instance.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crm
    volumes:
      # Postgres 18's image expects the volume at the parent directory (not
      # .../data directly) -- it manages a versioned subdirectory itself.
      - postgres-data:/var/lib/postgresql
    # Keeps this memory available under system-wide pressure (e.g. from the
    # memory-hungry voice-speech service sharing this VPS) instead of being
    # reclaimed first just because it's not the biggest consumer at that
    # moment -- a soft floor, not a hard cap on how much it can actually use.
    mem_reservation: 100m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads-data:/app/uploads
      # Invoice PDFs + monthly/yearly register CSVs (see src/lib/invoices.ts)
      - invoices-data:/app/invoices
    mem_reservation: 200m
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Lets this container reach other apps' host-only ports (e.g. another
    # project's "127.0.0.1:PORT:80" binding) via host.docker.internal --
    # its own 127.0.0.1 is just this container, not the host machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
      # Serves the Lead Finder CLI's generated demo sites at demo.codebunny.net
      # (see /opt/lead-finder-cli) -- read-only since this container only
      # displays them, never writes to them.
      - /opt/lead-finder-cli/lead-finder/demo-site:/srv/demo-site:ro
      # Serves the Lead Finder CLI's per-run reports (results/<run>/report.html)
      # at reports.codebunny.net, with directory browsing so old runs stay
      # reachable without remembering their folder names.
      - /opt/lead-finder-cli/lead-finder/results:/srv/reports:ro
      # Serves the static portfolio site at codebunny.net / www.codebunny.net
      - /opt/portfolio:/srv/portfolio:ro
    mem_reservation: 50m
    depends_on:
      - app
    networks:
      - default
      # Lets this container resolve/reach steam-ie-website-caddy-1 by name for
      # the steamie.net / steam-ie.com reverse proxy -- without this, recreating
      # this container drops that connection and those domains 502.
      - steam-ie-website_default

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  uploads-data:
  invoices-data:

networks:
  default:
    name: crm_default
  steam-ie-website_default:
    external: true
